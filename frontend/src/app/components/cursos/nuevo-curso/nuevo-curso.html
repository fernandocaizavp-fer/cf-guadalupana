<mat-toolbar color="primary">
  <button mat-icon-button (click)="volver()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <span>Nuevo Curso</span>
</mat-toolbar>

<div class="content">
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>Crear Curso</mat-card-title>
      <mat-card-subtitle>Se crearán automáticamente las 10 materias del curso</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Rama Artesanal</mat-label>
        <input matInput [(ngModel)]="datos.ramaArtesanal" placeholder="Ej: Corte y Confección">
        <mat-icon matSuffix>build</mat-icon>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Año Formativo</mat-label>
        <input matInput [(ngModel)]="datos.anioFormativo" placeholder="Ej: Primero">
        <mat-icon matSuffix>school</mat-icon>
      </mat-form-field>

      <div class="row">
        <mat-form-field appearance="outline">
          <mat-label>Fecha de Inicio</mat-label>
          <input matInput type="date" [(ngModel)]="datos.fechaInicio">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha de Fin</mat-label>
          <input matInput type="date" [(ngModel)]="datos.fechaFin">
        </mat-form-field>
      </div>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="guardar()" [disabled]="loading">
        <mat-icon>save</mat-icon> CREAR CURSO
      </button>
      <button mat-stroked-button (click)="volver()">CANCELAR</button>
    </mat-card-actions>
  </mat-card>
</div>
